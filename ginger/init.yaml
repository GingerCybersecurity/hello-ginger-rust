networking:
  source: config
  ipv4:
    ip: 192.168.42.100
    netmask: 255.255.255.0
    broadcast: 192.168.42.255
    gateway: 192.168.42.1
    dns:
    - 1.1.1.1
commands:
- executable: /sbin/auditctl
  command_type: setup
  current_dir: /
  args:
  - "-R"
  - "/usr/etc/auditd/auditd.rules"
  uid: 0
  gid: 0
- executable: /sbin/auditd
  command_type: setup
  current_dir: /
  args:
  - "-c"
  - "/usr/etc/auditd"
  uid: 0
  gid: 0
- executable: /sbin/measurerd
  command_type: service
  current_dir: /
  args: ["--stdout"]
  uid: 2
  gid: 2
- executable: '/sbin/hello-ginger'
  command_type: target
  current_dir: /
  args: []
  uid: 10
  gid: 10
